# ===========================================================================
# EduTrack API Gateway — Nginx Configuration
# ===========================================================================
# Why Nginx over Traefik:
#   - Battle-tested rate limiting (limit_req_zone) with burst/nodelay
#   - Lower memory footprint for simple reverse proxy use cases
#   - Mature ecosystem of modules (auth_request, gzip, headers)
#   - Better documentation and community support
#   - Traefik excels at dynamic service discovery (K8s), which we don't need yet
# ===========================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    log_format main '[$time_local] $remote_addr "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'upstream=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # -----------------------------------------------------------------------
    # Performance
    # -----------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # -----------------------------------------------------------------------
    # Gzip Compression (offloaded from FastAPI GZipMiddleware)
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 500;
    gzip_types
        application/json
        application/graphql
        text/plain
        text/css
        text/xml
        application/javascript
        application/xml;

    # -----------------------------------------------------------------------
    # Rate Limiting Zones
    # -----------------------------------------------------------------------
    # General API: 30 requests/second per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    # Auth endpoints: 5 requests/second per IP (prevent brute force)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Heavy endpoints (AI, reports, bulk): 10 requests/second per IP
    limit_req_zone $binary_remote_addr zone=heavy:10m rate=10r/s;

    # GraphQL: 20 requests/second per IP
    limit_req_zone $binary_remote_addr zone=graphql:10m rate=20r/s;

    # Connection limiting: max 50 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Custom error responses for rate limiting
    limit_req_status 429;
    limit_conn_status 429;

    # -----------------------------------------------------------------------
    # Upstream (FastAPI backend)
    # -----------------------------------------------------------------------
    upstream edutrack_api {
        # Multiple backend instances for horizontal scaling
        # Docker Compose will resolve 'api' to all replicas
        server api:8000;

        # Connection keep-alive to backend
        keepalive 32;
    }

    # -----------------------------------------------------------------------
    # Server Block
    # -----------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Global connection limit
        limit_conn conn_limit 50;

        # ---------------------------------------------------------------
        # Security Headers (offloaded from Python SecurityHeadersMiddleware)
        # ---------------------------------------------------------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ---------------------------------------------------------------
        # CORS Headers
        # ---------------------------------------------------------------
        # Pre-flight requests
        location @cors_preflight {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-Trace-Id" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # ---------------------------------------------------------------
        # Health Check (gateway level)
        # ---------------------------------------------------------------
        location = /health {
            proxy_pass http://edutrack_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # ---------------------------------------------------------------
        # Auth Endpoints — Strict rate limiting
        # ---------------------------------------------------------------
        location /api/v1/user/auth/ {
            limit_req zone=auth burst=3 nodelay;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://edutrack_api;
            include /etc/nginx/proxy_params.conf;
        }

        # ---------------------------------------------------------------
        # Heavy Endpoints — AI Insights, Reports, Bulk
        # ---------------------------------------------------------------
        location /api/v1/insights/ {
            limit_req zone=heavy burst=5 nodelay;
            proxy_pass http://edutrack_api;
            include /etc/nginx/proxy_params.conf;

            # Longer timeout for AI-powered endpoints
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /api/v1/reports/ {
            limit_req zone=heavy burst=5 nodelay;
            proxy_pass http://edutrack_api;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 120s;
        }

        location /api/v1/ai-coach/ {
            limit_req zone=heavy burst=5 nodelay;
            proxy_pass http://edutrack_api;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 300s;

            # SSE support for streaming responses
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        location /api/v1/bulk/ {
            limit_req zone=heavy burst=3 nodelay;
            proxy_pass http://edutrack_api;
            include /etc/nginx/proxy_params.conf;
            client_max_body_size 20m;
        }

        location /api/v1/dashboard/ {
            limit_req zone=heavy burst=10 nodelay;
            proxy_pass http://edutrack_api;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 60s;
        }

        # ---------------------------------------------------------------
        # GraphQL Endpoint
        # ---------------------------------------------------------------
        location /graphql {
            limit_req zone=graphql burst=10 nodelay;
            proxy_pass http://edutrack_api;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 30s;
        }

        # ---------------------------------------------------------------
        # Generated Reports (static file serving)
        # ---------------------------------------------------------------
        location /static/reports/ {
            alias /app/generated_reports/;
            autoindex off;
            expires 1h;
            add_header Cache-Control "private, no-transform";
        }

        # ---------------------------------------------------------------
        # All Other API Endpoints — General rate limit
        # ---------------------------------------------------------------
        location /api/ {
            limit_req zone=general burst=20 nodelay;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://edutrack_api;
            include /etc/nginx/proxy_params.conf;
        }

        # ---------------------------------------------------------------
        # Root
        # ---------------------------------------------------------------
        location / {
            proxy_pass http://edutrack_api;
            include /etc/nginx/proxy_params.conf;
        }

        # ---------------------------------------------------------------
        # Custom error pages
        # ---------------------------------------------------------------
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"code":"RATE_LIMITED","message":"Too many requests. Please slow down.","details":null,"trace_id":null}';
        }

        error_page 502 503 504 @gateway_error;
        location @gateway_error {
            default_type application/json;
            return 502 '{"code":"GATEWAY_ERROR","message":"Service temporarily unavailable. Please try again.","details":null,"trace_id":null}';
        }
    }
}
